<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strava Stats</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="landing">
    <h1>Strava Stats</h1>
    <p class="tagline">Your year at a glance. Minimal activity calendars from your Strava data.</p>

    <a href="/auth/strava" class="strava-btn">
      <img src="https://developers.strava.com/images/btn_strava_connectwith_orange.svg" alt="Connect with Strava">
    </a>

    <div class="preview">
      <p class="preview-label">What you'll get</p>
      <div class="preview-grid">
        <div class="preview-item">
          <strong>Year calendars</strong>
          <span>Every activity on a minimal month grid</span>
        </div>
        <div class="preview-item">
          <strong>Activity stats</strong>
          <span>Sessions, distance, elevation by type</span>
        </div>
        <div class="preview-item">
          <strong>Shareable link</strong>
          <span>A permanent URL for your page</span>
        </div>
      </div>
    </div>

    <p class="attribution">
      <img src="https://developers.strava.com/images/api_logo_pwrdBy_strava_horiz_light.svg" alt="Powered by Strava" width="140">
    </p>
  </div>
</body>
</html>
